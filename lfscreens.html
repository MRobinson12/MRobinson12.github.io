<!DOCTYPE html>
<style>
  body {
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-image: url(LincsFurs/FlagLogo.png);
    background-size: cover;
  }
  p {
    font-family: "Comic Sans MS";
    text-align: center;
    align-self: center;
    display: block;
    color: purple;
    font-size: 700%;
    text-shadow: 2px 2px black;
  }
</style>

<html>
  <head>
  </head>
  <body>

    <script>
      let i = 0 
      let p = 5 /* Image Count */
      window.onload = function () {
      // Array of Images
      var backgroundImg=[/* Schedule of the Day */
                        "LincsFurs/schedule.png"

                        /* LincsFurs Logo */
                        ,"LincsFurs/flaglogo.png"

                        /* Dates and Info of Next Meet */ 

                        /* Featured Suiter (3) */
                        ,"LincsFurs/photo1.jpg"
                        ,"LincsFurs/photo2.jpg"
                        ,"LincsFurs/photo3.jpg"

                        /* QR Codes - Socials - Link Tree - Featured Peeps Details */

                        /* Walk Soon Warning - Check Time*/ 
                        ,"LincsFurs/walkreminder.jpg"
                        ]
                        
      setInterval(changeImage, 1000);
        function changeImage() {   
          walkreminder()
          i = Math.floor((i + 1) % p /* Set to array Number! */);
          console.log(i);
          document.body.style.backgroundImage = "url('"+backgroundImg[i]+"')";
          }

        function walkreminder()
        {
          const now = new Date();
          const hour = now.getHours();
          const minute = now.getMinutes();

          if (hour === 14 && minute >= 5 && minute <= 30) {
            p = 6
          } else {
            p = 5
          }
        }
      }
        
    </script>
  </body>
</html>
